<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- 语言选择器 -->
    <div class="language-selector">
      <select id="languageSelect">
        <option value="zh_CN">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>

    <!-- 文本编辑区 -->
    <div class="editor-section">
      <textarea id="textInput" data-i18n-placeholder="inputPlaceholder"></textarea>
    </div>

    <!-- 模板选择区 -->
    <div class="template-section">
      <h3 data-i18n="templates.title">选择模板</h3>
      <div id="templateList" class="template-list">
        <!-- 模板列表由JS动态生成 -->
      </div>
    </div>

    <!-- 样式编辑区 -->
    <div class="style-section">
      <h3 data-i18n="settings.title">样式设置</h3>
      <div class="style-controls">
        <!-- 背景设置 -->
        <div class="control-group">
          <label data-i18n="settings.background">背景</label>
          <div class="background-controls">
            <div class="bg-type-selector">
              <label>
                <input type="radio" name="bgType" value="color" checked>
                <span data-i18n="settings.backgroundType.solid">纯色</span>
              </label>
              <label>
                <input type="radio" name="bgType" value="gradient">
                <span data-i18n="settings.backgroundType.gradient">渐变</span>
              </label>
            </div>

            <!-- 纯色控制 -->
            <div id="solidColorControls">
              <input type="color" id="bgColorPicker" value="#ffffff">
            </div>

            <!-- 渐变控制 -->
            <div id="gradientControls" style="display: none;">
              <div class="gradient-type">
                <label>
                  <input type="radio" name="gradientType" value="linear" checked>
                  <span data-i18n="settings.gradientType.linear">线性渐变</span>
                </label>
                <label>
                  <input type="radio" name="gradientType" value="radial">
                  <span data-i18n="settings.gradientType.radial">径向渐变</span>
                </label>
              </div>

              <div class="gradient-direction">
                <label data-i18n="settings.direction">方向</label>
                <select id="gradientDirection">
                  <option value="to right" data-i18n="settings.direction.toRight">从左到右</option>
                  <option value="to bottom" data-i18n="settings.direction.toBottom">从上到下</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- 字体设置 -->
        <div class="control-group">
          <label data-i18n="settings.font">字体</label>
          <div class="font-controls">
            <select id="fontFamily">
              <option value="Microsoft YaHei">微软雅黑</option>
              <option value="SimSun">宋体</option>
              <option value="KaiTi">楷体</option>
            </select>
            <input type="number" id="fontSize" value="16" min="12" max="72">
            <input type="color" id="fontColor" value="#000000">
          </div>
        </div>

        <!-- 布局设置 -->
        <div class="control-group">
          <label data-i18n="settings.layout">布局</label>
          <div class="layout-controls">
            <input type="range" id="padding" min="0" max="100" value="20">
            <div class="text-align">
              <button data-align="left">⇱</button>
              <button data-align="center">⇲</button>
              <button data-align="right">⇳</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 预览区域 -->
    <div class="preview-section">
      <div id="cardPreview" class="card-preview">
        <!-- 预览内容 -->
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button id="exportBtn" data-i18n="buttons.export">导出图片</button>
      <button id="saveTemplateBtn" data-i18n="buttons.saveTemplate">保存模板</button>
    </div>

    <!-- 导出对话框 -->
    <div id="exportDialog" class="dialog" style="display: none;">
      <div class="dialog-content">
        <h3 data-i18n="export.title">导出设置</h3>
        <select id="exportFormat">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WEBP</option>
        </select>
        <input type="range" id="exportQuality" min="1" max="100" value="90">
        <div class="dialog-buttons">
          <button id="cancelExport" data-i18n="buttons.cancel">取消</button>
          <button id="confirmExport" data-i18n="buttons.confirm">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载状态 -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
  </div>

  <!-- 脚本引入 -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/security.js"></script>
  <script src="js/performance.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/templateManager.js"></script>
  <script src="js/styleEditor.js"></script>
  <script src="js/cardExporter.js"></script>
  <script src="popup.js"></script>
</body>

</html>
