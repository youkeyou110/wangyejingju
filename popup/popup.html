<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句卡片生成器</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/popup.css">
</head>

<body>
  <!-- 导航栏 -->
  <nav class="nav-bar">
    <div class="nav-logo">
      <img src="images/logo.png" alt="Logo">
      <span class="nav-title" data-i18n="appName">金句卡片生成器</span>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle">
        <i class="icon-theme"></i>
      </button>
      <button class="settings-btn" id="settingsBtn">
        <i class="icon-settings"></i>
      </button>
      <button class="user-btn" id="userBtn">
        <i class="icon-user"></i>
      </button>
    </div>
  </nav>

  <!-- 主要内容 -->
  <main class="main-content">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn" data-action="template">
          <i class="icon-template"></i>
          <span data-i18n="template">模板</span>
        </button>
        <button class="tool-btn" data-action="text">
          <i class="icon-text"></i>
          <span data-i18n="text">文本</span>
        </button>
        <button class="tool-btn" data-action="style">
          <i class="icon-style"></i>
          <span data-i18n="style">样式</span>
        </button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" data-action="undo">
          <i class="icon-undo"></i>
        </button>
        <button class="tool-btn" data-action="redo">
          <i class="icon-redo"></i>
        </button>
      </div>
    </div>

    <!-- 编辑区域 -->
    <div class="editor-container">
      <div class="editor" id="editor" contenteditable="true"></div>
    </div>

    <!-- 预览区域 -->
    <div class="preview-container">
      <div class="preview" id="preview"></div>
      <div class="preview-actions">
        <button class="preview-btn" data-action="download">
          <i class="icon-download"></i>
          <span data-i18n="download">下载</span>
        </button>
        <button class="preview-btn" data-action="share">
          <i class="icon-share"></i>
          <span data-i18n="share">分享</span>
        </button>
      </div>
    </div>
  </main>

  <!-- 通用组件 -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-content">
      <div class="dialog-header">
        <h3 class="dialog-title"></h3>
        <button class="dialog-close">&times;</button>
      </div>
      <div class="dialog-body"></div>
      <div class="dialog-footer"></div>
    </div>
  </div>

  <div class="notification" id="notification" hidden>
    <i class="notification-icon"></i>
    <span class="notification-message"></span>
    <button class="notification-close">&times;</button>
  </div>

  <div class="loading" id="loading" hidden>
    <div class="loading-spinner"></div>
    <span class="loading-text" data-i18n="loading">加载中...</span>
  </div>

  <script src="js/popup.js" type="module"></script>
</body>

</html>
