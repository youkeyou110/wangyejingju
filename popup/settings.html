<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 金句卡片生成器</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="nav-bar">
        <div class="nav-logo">
            <button class="back-btn" id="backBtn">
                <i class="icon-back"></i>
            </button>
            <span class="nav-title" data-i18n="settings">设置</span>
        </div>
    </nav>

    <!-- 设置内容 -->
    <main class="settings-content">
        <!-- 常规设置 -->
        <section class="settings-section">
            <h2 class="section-title" data-i18n="settings.general">常规设置</h2>

            <!-- 语言设置 -->
            <div class="setting-item">
                <label data-i18n="settings.language">语言</label>
                <select class="input" id="languageSelect">
                    <option value="zh_CN">简体中文</option>
                    <option value="en">English</option>
                </select>
            </div>

            <!-- 主题设置 -->
            <div class="setting-item">
                <label data-i18n="settings.theme">主题</label>
                <select class="input" id="themeSelect">
                    <option value="light" data-i18n="settings.theme.light">浅色</option>
                    <option value="dark" data-i18n="settings.theme.dark">深色</option>
                    <option value="system" data-i18n="settings.theme.system">跟随系统</option>
                </select>
            </div>

            <!-- 自动保存 -->
            <div class="setting-item">
                <label data-i18n="settings.autoSave">自动保存</label>
                <div class="switch">
                    <input type="checkbox" id="autoSaveSwitch">
                    <span class="slider"></span>
                </div>
            </div>
        </section>

        <!-- 编辑器设置 -->
        <section class="settings-section">
            <h2 class="section-title" data-i18n="settings.editor">编辑器设置</h2>

            <!-- 默认字体 -->
            <div class="setting-item">
                <label data-i18n="settings.defaultFont">默认字体</label>
                <select class="input" id="defaultFontSelect">
                    <option value="default" data-i18n="settings.font.default">系统默认</option>
                    <option value="microsoft-yahei">微软雅黑</option>
                    <option value="simsun">宋体</option>
                    <option value="kaiti">楷体</option>
                </select>
            </div>

            <!-- 默认字号 -->
            <div class="setting-item">
                <label data-i18n="settings.fontSize">默认字号</label>
                <input type="number" class="input" id="fontSizeInput" min="12" max="72" value="16">
            </div>

            <!-- 默认颜色 -->
            <div class="setting-item">
                <label data-i18n="settings.defaultColor">默认颜色</label>
                <input type="color" class="input" id="defaultColorInput" value="#000000">
            </div>
        </section>

        <!-- 同步设置 -->
        <section class="settings-section">
            <h2 class="section-title" data-i18n="settings.sync">同步设置</h2>

            <!-- 自动同步 -->
            <div class="setting-item">
                <label data-i18n="settings.autoSync">自动同步</label>
                <div class="switch">
                    <input type="checkbox" id="autoSyncSwitch">
                    <span class="slider"></span>
                </div>
            </div>

            <!-- 同步频率 -->
            <div class="setting-item">
                <label data-i18n="settings.syncInterval">同步频率</label>
                <select class="input" id="syncIntervalSelect">
                    <option value="5">5分钟</option>
                    <option value="15">15分钟</option>
                    <option value="30">30分钟</option>
                    <option value="60">1小时</option>
                </select>
            </div>
        </section>

        <!-- 快捷键设置 -->
        <section class="settings-section">
            <h2 class="section-title" data-i18n="settings.shortcuts">快捷键设置</h2>

            <div class="shortcuts-list">
                <!-- 新建 -->
                <div class="shortcut-item">
                    <span data-i18n="shortcuts.new">新建</span>
                    <div class="shortcut-keys">
                        <kbd>Ctrl</kbd> + <kbd>N</kbd>
                    </div>
                </div>

                <!-- 保存 -->
                <div class="shortcut-item">
                    <span data-i18n="shortcuts.save">保存</span>
                    <div class="shortcut-keys">
                        <kbd>Ctrl</kbd> + <kbd>S</kbd>
                    </div>
                </div>

                <!-- 导出 -->
                <div class="shortcut-item">
                    <span data-i18n="shortcuts.export">导出</span>
                    <div class="shortcut-keys">
                        <kbd>Ctrl</kbd> + <kbd>E</kbd>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/settings.js" type="module"></script>
</body>

</html>
