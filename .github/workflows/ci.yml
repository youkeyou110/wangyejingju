name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x]
        mongodb-version: [4.4]

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.7.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}

    - name: Install frontend dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm test

    - name: Install backend dependencies
      run: |
        cd server
        npm ci

    - name: Run backend tests
      run: |
        cd server
        npm test

    - name: Build frontend
      run: npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server
        npm ci

    - name: Run ESLint
      run: |
        npm run lint
        cd server
        npm run lint

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server
        npm ci

    - name: Run coverage
      run: |
        npm run test:coverage
        cd server
        npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
