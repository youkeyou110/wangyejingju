<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句卡片预览</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-container {
            max-width: 100%;
            width: 600px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .quote-card {
            min-height: 200px;
            word-break: break-all;
            position: relative;
        }

        .watermark {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="preview-container">
        <div id="quote-card" class="quote-card">
            <!-- 内容将通过JavaScript动态添加 -->
        </div>
    </div>
    <script>
        function decodeParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            if (!encodedData) return null;

            try {
                const jsonStr = decodeURIComponent(atob(encodedData));
                return JSON.parse(jsonStr);
            } catch (error) {
                console.error('解析参数失败:', error);
                return null;
            }
        }

        function renderQuoteCard(params) {
            const quoteCard = document.getElementById('quote-card');
            if (!params) {
                quoteCard.textContent = '无效的参数';
                return;
            }

            // 应用样式
            Object.assign(quoteCard.style, params.style);

            // 设置文本
            quoteCard.textContent = params.text;

            // 添加水印
            const watermark = document.createElement('div');
            watermark.className = 'watermark';
            watermark.textContent = '由金句卡片生成器创建';
            quoteCard.appendChild(watermark);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const params = decodeParams();
            renderQuoteCard(params);
        });
    </script>
</body>

</html>
